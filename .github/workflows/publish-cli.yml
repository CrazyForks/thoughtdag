# Publish the command-line query layer (thoughtdag) to npm on every release
# tag, through npm Trusted Publishing — the same route as the plugin: the job
# proves it is this repository's workflow via GitHub's OIDC token and npm
# mints a short-lived credential. No token on any machine.
#
# One-time setup on npmjs.com (package thoughtdag → Settings → Trusted
# Publisher → GitHub Actions): owner chenxiachan, repository thoughtdag,
# workflow filename publish-cli.yml, environment left empty. Until that is
# registered, the publish step fails with 404 and nothing else is affected.
#
# Skips existing npm and MCP Registry versions independently, so a retry can
# finish registry publishing after npm has succeeded. Keep cli/server.json,
# cli/package.json and CLI_VERSION in cli/src/lib.ts at the same CLI version.
name: publish cli

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # no registry-url here (see publish-plugin.yml): a placeholder token would skip the OIDC exchange
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Decide whether this version is new
        id: check
        run: |
          local_v=$(node -p "require('./cli/package.json').version")
          if npm view "thoughtdag@${local_v}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "thoughtdag@${local_v} is already on npm, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test the CLI
        run: npm --prefix cli test

      - name: Check distribution metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('cli/package.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('cli/server.json', 'utf8'));
          assert.equal(server.name, pkg.mcpName);
          assert.equal(server.version, pkg.version);
          assert.equal(server.packages[0].identifier, pkg.name);
          assert.equal(server.packages[0].version, pkg.version);
          assert.equal(server.packages[0].transport.type, 'stdio');
          assert.deepEqual(server.packages[0].packageArguments, [{ type: 'positional', value: 'mcp' }]);
          JS

      - name: Publish thoughtdag
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        run: npm publish --provenance --access public --loglevel verbose

      - name: Check MCP Registry version
        id: registry
        run: |
          registry_url=$(node -p "const s = require('./cli/server.json'); 'https://registry.modelcontextprotocol.io/v0.1/servers/' + encodeURIComponent(s.name) + '/versions/' + encodeURIComponent(s.version)")
          echo "url=$registry_url" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --retry 3 --max-time 30 --output "$RUNNER_TEMP/mcp-entry.json" --write-out '%{http_code}' "$registry_url")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "MCP Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Install MCP publisher
        if: steps.registry.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' \
            --output mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz' | sha256sum --check
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Publish to MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish cli/server.json

      - name: Verify the public Registry entry
        env:
          REGISTRY_URL: ${{ steps.registry.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 "$REGISTRY_URL" --output "$RUNNER_TEMP/mcp-entry.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const expected = JSON.parse(fs.readFileSync('cli/server.json', 'utf8'));
          const actual = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/mcp-entry.json`, 'utf8')).server;
          assert.equal(actual.name, expected.name);
          assert.equal(actual.version, expected.version);
          assert.equal(actual.packages[0].identifier, expected.packages[0].identifier);
          assert.equal(actual.packages[0].version, expected.version);
          assert.equal(actual.packages[0].transport.type, 'stdio');
          assert.deepEqual(actual.packages[0].packageArguments, expected.packages[0].packageArguments);
          console.log(`Verified ${actual.name}@${actual.version}`);
          JS
