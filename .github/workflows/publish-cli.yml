# Publish the command-line query layer (thoughtdag) to npm on every release
# tag, through npm Trusted Publishing — the same route as the plugin: the job
# proves it is this repository's workflow via GitHub's OIDC token and npm
# mints a short-lived credential. No token on any machine.
#
# One-time setup on npmjs.com (package thoughtdag → Settings → Trusted
# Publisher → GitHub Actions): owner chenxiachan, repository thoughtdag,
# workflow filename publish-cli.yml, environment left empty. Until that is
# registered, the publish step fails with 404 and nothing else is affected.
#
# Skips quietly when the version in cli/package.json is already on npm.
name: publish cli

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # no registry-url here (see publish-plugin.yml): a placeholder token would skip the OIDC exchange
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Decide whether this version is new
        id: check
        run: |
          local_v=$(node -p "require('./cli/package.json').version")
          if npm view "thoughtdag@${local_v}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "thoughtdag@${local_v} is already on npm, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the bundle
        run: npm run cli:build

      - name: Publish thoughtdag
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        run: npm publish --provenance --access public --loglevel verbose
