name: Deploy website and docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-story-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: thoughtdag-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Build website and documentation
        env:
          THOUGHTDAG_RELEASE: ${{ steps.release.outputs.tag }}
        run: npm run website:build

      - name: Check pages and discovery metadata
        run: npm run website:check

      - name: Upload website and documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
