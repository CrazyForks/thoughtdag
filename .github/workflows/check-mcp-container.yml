name: Check MCP container

on:
  workflow_dispatch:
  push:
    paths:
      - cli/Dockerfile
      - cli/server.json
      - .github/workflows/check-mcp-container.yml
  pull_request:
    paths:
      - cli/Dockerfile
      - cli/server.json
      - .github/workflows/check-mcp-container.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the published CLI image
        run: docker build -f cli/Dockerfile -t thoughtdag-mcp-check cli
      - name: Check stdio without network access or source sessions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          version = json.loads(Path('cli/server.json').read_text())['version']
          frames = [
              {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {
                  'protocolVersion': '2025-06-18', 'capabilities': {},
                  'clientInfo': {'name': 'container-smoke', 'version': '1'}}},
              {'jsonrpc': '2.0', 'method': 'notifications/initialized'},
              {'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'},
              {'jsonrpc': '2.0', 'id': 3, 'method': 'ping'},
              {'jsonrpc': '2.0', 'id': 4, 'method': 'tools/call', 'params': {
                  'name': 'why_check', 'arguments': {'path': 'synthetic-file.ts'}}},
              {'jsonrpc': '2.0', 'id': 5, 'method': 'tools/call', 'params': {
                  'name': 'find', 'arguments': {'phrase': 'synthetic-query'}}},
          ]
          run = subprocess.run([
              'docker', 'run', '--rm', '-i', '--network', 'none', '--read-only',
              '--tmpfs', '/home/node/.thoughtdag:uid=1000,gid=1000,mode=0700',
              'thoughtdag-mcp-check',
          ], input='\n'.join(map(json.dumps, frames)) + '\n',
              capture_output=True, text=True, timeout=45, check=True)
          responses = {r['id']: r for r in map(json.loads, run.stdout.splitlines())}
          assert responses[1]['result']['serverInfo']['version'] == version
          names = [t['name'] for t in responses[2]['result']['tools']]
          assert names == ['why_check', 'why_file', 'find', 'recall_turn'], names
          assert responses[3]['result'] == {}
          for request_id in (4, 5):
              assert not responses[request_id]['result'].get('isError'), responses[request_id]
          assert 'no history' in responses[4]['result']['content'][0]['text']
          print(json.dumps({'version': version, 'tools': names,
              'network': 'none', 'root_filesystem': 'read-only', 'source_sessions': 'none'}))
          PY
